[package]
name = "rustmite-sift"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fleet-wide anomaly detection (IronSift) — TF-IDF + DBSCAN, files, temporal + AnoMark"
authors.workspace = true
repository.workspace = true

[lib]
name = "rustmite_sift"
path = "src/lib.rs"

[[bin]]
name = "rustmite-sift"
path = "bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "rustmite-sift-server"
path = "bin/server.rs"
required-features = ["cli"]

[[bin]]
name = "rustmite-sift-generator"
path = "bin/generator.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:axum", "dep:tower-http", "dep:tokio", "dep:clap", "dep:env_logger", "dep:tracing-subscriber"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"

linfa = "0.7"
linfa-clustering = "0.7"
linfa-nn = "0.7"
ndarray = "0.15"

rayon = "1.8"

rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
log = "0.4"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
ahash = "0.8"

env_logger = { version = "0.11", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
axum = { version = "0.7", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"], optional = true }
tower-http = { version = "0.5", features = ["cors", "trace"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

# AnoMark is a first-class RustMite crate (vendored from anomark-rs).
rustmite-anomark = { workspace = true }

rustmite-proto = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
