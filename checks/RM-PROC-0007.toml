id = "RM-PROC-0007"
version = 1
name = "Fake kernel thread (bracketed comm with real exe)"
type = "process"
severity = "high"
confidence = "high"
enabled = true
cost = "trivial"
match = "process"
where = '''
  process.comm matches "^\[.*\]$"
  and process.exe != null
  and process.exe != ""
'''
title = "Process '{{process.comm}}' masquerades as a kernel thread"
evidence_fields = ["pid", "comm", "exe", "cmdline", "uid", "starttime"]
attack = ["T1014", "T1036"]
rationale = "Real kernel threads have no exe link. A bracketed comm with a backing executable indicates a userland process disguising itself."
false_positives = "None known on standard distros. Some embedded init systems spawn bracketed userland helpers; allowlist if confirmed benign."
