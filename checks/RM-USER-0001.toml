id = "RM-USER-0001"
version = 1
name = "UID 0 account other than root"
type = "user"
severity = "critical"
confidence = "high"
enabled = true
cost = "trivial"
match = "account"
where = '''
  account.uid == 0
  and account.username != "root"
'''
title = "UID 0 account '{{account.username}}' other than root"
evidence_fields = ["username", "uid", "gid", "home", "shell"]
attack = ["T1136"]
rationale = "Additional uid-0 accounts are a common backdoor."

[test]
fires_on = ["uid0-extra-account"]
silent_on = ["clean-ubuntu2204"]
source = "collector"

[test.expect]
title_contains = "UID 0 account"

[test.expect.evidence]
username = "backdoor"
