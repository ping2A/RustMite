id = "RM-ICS-0004"
version = 1
name = "ICS exploit staging under /home/runtime/tmp"
type = "file"
severity = "high"
confidence = "medium"
enabled = true
cost = "low"
match = "file_meta"
where = '''
  file_meta.path != null
  and file_meta.path.path_under("/home/runtime/tmp")
  and (
    file_meta.path matches "ics-root-"
    or file_meta.path ends_with ".pl"
    or file_meta.path matches "/[0-9a-f]{32}$"
  )
'''
title = "ICS runtime staging file {{file_meta.path}}"
evidence_fields = ["path", "mode", "uid", "gid", "size"]
attack = ["T1059.006", "T1105", "T1070"]
rationale = "CVE-2026-104935 RCE race: wu.cgi writes uploads to /home/runtime/tmp/<MD5(filename)> before ZIP validation; UTA0576 also drops ics-root-*-inband-*.pl payloads there for privilege escalation."
references = [
  "https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/",
]
collectors = ["file.ioc", "fs.anomaly"]

[test]
fires_on = ["hostile-catalog"]
silent_on = ["clean-ubuntu2204"]
source = "collector"

[test.expect]
title_contains = "ICS runtime staging"
