id = "RM-DIR-0001"
version = 1
name = "Directory link-count mismatch (hidden subdir)"
type = "directory"
severity = "high"
confidence = "high"
enabled = true
cost = "low"
match = "dir_anomaly"
where = '''
  dir_anomaly.anomaly == "link_count_mismatch"
'''
